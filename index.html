  <script>
        // Q.Bank Account Withdrawal

        // Create a Promise for withdrawing money.

        // Conditions:
        // - Account balance = Rs. 10,000
        // - Withdrawal amount = Rs. 7,000
        // - If balance is sufficient, resolve the Promise.
        // - Otherwise, reject the Promise.
        // Use .then() and .catch() to display the result.
        let check = new Promise(function (resolve, reject) {
          let balance = 10000;
          let widrawl = 7000;
          if (balance >= widrawl) {
            resolve("Widrawl successful!");
          } else {
            reject("Insufficient balance!");
          }
        });
        check.then(function (answer) {
          console.log("Widrawl Status:",answer);
        });
        check.catch(function (answer) {
          console.log("Widrawl Status:",answer);
        });
        // Q. Online Exam Result

        // Create a Promise that checks student results.
        // - Marks 50 or above: Pass.
        // - Marks below 50: Fail.
        // - Marks greater than 100 or less than 0: Invalid marks.
        // Handle the result using .then() and .catch().
        let checkmarks = new Promise(function (resolve, reject) {
          let marks = 100;
          if (marks > 100 || marks < 0) {
            reject("Invalid marks!");
          } else if (marks >= 50) {
            resolve("Pass!");
          } else {
            reject("Fail!");
          }
        });

        checkmarks.then(function (result) {
          console.log("Student Marks:",result);
        });
        checkmarks.catch(function (error) {
          console.log("Student Marks:",error);
        });

// Create a Promise that performs these operations:
// 1. Start with a number: 10.
// 2. Add 20.
// 3. Multiply the result by 2.
// 4. Subtract 5.
// 5. Display the final result.
// Use Promise chaining with multiple .then() methods.
let calculation =new Promise(function(resolve,reject){
    let number=10
      resolve(number) 
});
calculation
.then(function(answer){
    return answer +20

})
.then(function(answer){

})

})
